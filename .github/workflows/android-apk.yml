name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Export Godot project to APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Show Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/RPG-Solo-DnD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Solo-DnD-Android-APK
          path: build/RPG-Solo-DnD.apk
          if-no-files-found: error
          retention-days: 14
