name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Export Godot project to APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_VERSION="$(godot --version | sed 's/\.stable.*//')"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/godot-templates/templates.tpz
          unzip -q /tmp/godot-templates/templates.tpz -d /tmp/godot-templates/unpacked
          cp -a /tmp/godot-templates/unpacked/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Java, Android SDK and debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          JAVA_DIR="${JAVA_HOME:-}"
          if [ -z "$JAVA_DIR" ] || [ ! -x "$JAVA_DIR/bin/java" ]; then
            JAVA_BIN="$(command -v java)"
            JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          fi

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR/platform-tools" ]; then
            for candidate in /opt/android-sdk /usr/lib/android-sdk /usr/local/lib/android/sdk /root/Android/Sdk; do
              if [ -d "$candidate/platform-tools" ]; then SDK_DIR="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR/platform-tools" ]; then
            echo "Android SDK not found in the expected locations."
            env | grep -E 'ANDROID|JAVA_HOME' || true
            exit 1
          fi

          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_DIR"
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Java SDK: $JAVA_DIR"
          echo "Android SDK: $SDK_DIR"
          java -version
          test -x "$JAVA_DIR/bin/java"

      - name: Show Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/RPG-Solo-DnD.apk
          test -s build/RPG-Solo-DnD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Solo-DnD-Android-APK
          path: build/RPG-Solo-DnD.apk
          if-no-files-found: error
          retention-days: 14
